<svg viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
  <defs>
    {/* Deep slate/navy background with high contrast */}
    <linearGradient id="fav-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e2b4a" />
      <stop offset="40%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    {/* High-tech pastel blue gradient for structured data bars */}
    <linearGradient id="fav-bar" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#4a85e2" />
      <stop offset="100%" stop-color="#93bdfd" />
    </linearGradient>
    {/* Polished metallic gold gradient for the focal risk node */}
    <linearGradient id="fav-gold" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#d4a13c" />
      <stop offset="100%" stop-color="#fde047" />
    </linearGradient>
    {/* Glossy glass sheen overlay */}
    <linearGradient id="fav-sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
    {/* Soft amber-gold glow behind the risk node */}
    <radialGradient id="fav-gold-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e8c477" stop-opacity="0.65" />
      <stop offset="100%" stop-color="#e8c477" stop-opacity="0" />
    </radialGradient>
  </defs>

  {/* Main Shield body */}
  <path
    d="M24 4L38 8.5v12.5c0 10.5-6.5 17.5-14 21C16.5 38.5 10 31.5 10 21V8.5L24 4z"
    fill="url(#fav-bg)"
    stroke="#1e293b"
    stroke-width="1.2"
  />

  {/* Nested record layers to create "stack of records" feel */}
  <path
    d="M24 7.5L35 11v9.5c0 8-5 13.5-11 16-6-2.5-11-8-11-16V11l11-3.5z"
    fill="none"
    stroke="#16203a"
    stroke-width="0.85"
    opacity="0.6"
  />

  {/* Glossy glass sheen reflection overlay */}
  <path
    d="M24 4.5L37.5 9v12c0 2.5-0.4 4.8-1 7C31.5 22.5 28 17 24 17S16.5 22.5 11.5 28c-0.6-2.2-1-4.5-1-7V9L24 4.5z"
    fill="url(#fav-sheen)"
    opacity="0.15"
  />

  {/* Three Ascending Data Bars */}
  <rect x="17" y="25" width="3" height="9" rx="1.5" fill="url(#fav-bar)" opacity="0.75" />
  <rect x="22.5" y="20" width="3" height="14" rx="1.5" fill="url(#fav-bar)" opacity="0.85" />
  <rect x="28" y="15" width="3" height="19" rx="1.5" fill="url(#fav-bar)" />

  {/* Glowing Gold Risk Signal Node */}
  <circle cx="29.5" cy="9.5" r="7" fill="url(#fav-gold-glow)" />
  <circle cx="29.5" cy="9.5" r="3" fill="url(#fav-gold)" />
  <circle cx="28.5" cy="8.5" r="0.8" fill="#ffffff" opacity="0.85" />
</svg>
